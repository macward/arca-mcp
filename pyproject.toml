[project]
name = "arca-mcp"
version = "0.2.0"
description = "MCP server for ARCA/AFIP fiscal operations"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0",
    "cryptography>=43.0",
    "lxml>=5.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "playwright>=1.48",
    "httpx>=0.27",
]

[project.scripts]
arca-mcp = "arca_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/arca_mcp"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: tests que pegan a wsaahomo.afip.gov.ar (requieren ARCA_TEST_CERT_PATH y ARCA_TEST_KEY_PATH; skip si no están)",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

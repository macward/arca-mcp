[project]
name = "arca-mcp"
version = "0.6.1"
description = "MCP server for ARCA/AFIP fiscal operations (WSAA + WSFE) for developers and AI agents"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Max Ward", email = "ward.maximiliano@gmail.com" },
]
keywords = [
    "arca",
    "afip",
    "mcp",
    "wsaa",
    "wsfe",
    "facturacion-electronica",
    "argentina",
    "fiscal",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "fastmcp>=2.0",
    "cryptography>=43.0",
    "lxml>=5.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "starlette>=0.37",
    "httpx>=0.27",
    "zeep>=4.2",
    "qrcode[pil]>=7.4",
    "reportlab>=4.5.1",
]

[project.optional-dependencies]
# Automatización del portal ARCA (roadmap v1.0). Instalar con: pip install "arca-mcp[portal]"
portal = ["playwright>=1.48"]

[project.urls]
Homepage = "https://github.com/macward/arca-mcp"
Repository = "https://github.com/macward/arca-mcp"
Issues = "https://github.com/macward/arca-mcp/issues"
Changelog = "https://github.com/macward/arca-mcp/blob/main/CHANGELOG.md"

[project.scripts]
arca-mcp = "arca_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/arca_mcp"]

[dependency-groups]
dev = [
    "pypdf>=6.12.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "e2e: tests que pegan a wsaahomo.afip.gov.ar (requieren ARCA_TEST_CERT_PATH y ARCA_TEST_KEY_PATH; skip si no están)",
]

[tool.deptry.per_rule_ignores]
# playwright es un extra opcional (arca-mcp[portal]) reservado para la
# automatización del portal ARCA del roadmap v1.0; aún no se importa.
DEP002 = ["playwright"]

[tool.ruff]
line-length = 150

[tool.ruff.lint]
select = ["E", "F", "I", "B904"]
